name: Exam Reminder

on:
  schedule:
    # 每小时运行一次（UTC 时间），确保能及时处理新消息和提醒
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 更新考试时间数据
        run: node scripts/fetch-exams.js

      - name: 安装依赖
        run: npm install

      - name: 自动抓取考试时间
        run: node scripts/fetch-exams.js

      - name: 处理 ntfy 消息并检查提醒
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: node scripts/check.js

      - name: 提交数据更改
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/exams.json data/todos.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Update data from actions"
          git push

      - name: 生成日历文件
        run: node scripts/gen-ics.js

      - name: 发布到 GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          publish_branch: gh-pages
